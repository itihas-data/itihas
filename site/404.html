<style>

*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; font-family: var(--font-sans); font-size: 16px; line-height: 26px; color: var(--ink); background: var(--surface); -webkit-font-smoothing: antialiased; }

<script>
// This file may be served for a missing page at any depth. On a GitHub Pages project site the site lives in
// the first folder of the address (user.github.io/project/); anywhere else it lives at the root.
(function () {
  var first = location.pathname.split("/")[1];
  var base = /\.github\.io$/.test(location.hostname) && first ? "/" + first + "/" : "/";
  document.querySelectorAll("a[data-to]").forEach(function (a) { a.href = base + a.dataset.to; });
})();
